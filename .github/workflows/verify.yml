name: Verify public static browser
on:
  workflow_dispatch:
    inputs:
      deployment_only:
        description: Verify the Pages build API once without browser install, collection or model calls
        type: boolean
        default: false
permissions:
  contents: read
  checks: write
  pages: write
jobs:
  verify:
    if: ${{ github.repository == 'darkcai726-wq/taiwan-intelligence-public' && github.event.repository.private == false && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install browser driver only for this manual verification
        if: ${{ !inputs.deployment_only }}
        run: npm install --prefix "$RUNNER_TEMP/public-browser" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
      - name: Verify fresh desktop and mobile sessions on the deployed URL
        if: ${{ !inputs.deployment_only }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/public-browser
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright-core';
          import assert from 'node:assert/strict';
          import {existsSync,appendFileSync} from 'node:fs';
          const root='https://darkcai726-wq.github.io/taiwan-intelligence-public/';
          const response=await fetch(root+'snapshot.json',{cache:'no-store'});assert.equal(response.status,200);
          const manifest=await response.json();assert.ok(manifest.index.length>=100);
          const executablePath=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(existsSync);assert.ok(executablePath);
          const browser=await chromium.launch({executablePath,args:['--no-sandbox']});const evidence=[];
          try{for(const width of [1440,390]){
            const context=await browser.newContext({viewport:{width,height:900},serviceWorkers:'allow'}),page=await context.newPage(),requests=[],errors=[];
            page.on('request',req=>requests.push({url:req.url(),method:req.method()}));page.on('pageerror',err=>errors.push(err.message));
            await page.goto(root,{waitUntil:'networkidle'});await page.locator('.article-card').first().waitFor();assert.equal(await page.locator('.article-card').count(),5);assert.equal(await page.getByRole('dialog').count(),0);
            for(let i=0;i<5;i++){
              const card=page.locator('.article-card').nth(i),button=card.getByRole('button');
              await button.evaluate(el=>el.scrollIntoView({block:'center',behavior:'instant'}));await page.waitForTimeout(120);const before=await page.evaluate(()=>scrollY),box=await button.boundingBox();
              await page.mouse.click(box.x+box.width/2,box.y+box.height/2);await page.waitForTimeout(120);
              assert.equal(await card.evaluate(el=>getComputedStyle(el).opacity),'1');assert.ok((await card.getAttribute('class')).includes('expanded'));assert.ok(Math.abs((await page.evaluate(()=>scrollY))-before)<3);
              await button.evaluate(el=>el.scrollIntoView({block:'center',behavior:'instant'}));await button.click();assert.equal(await card.evaluate(el=>getComputedStyle(el).opacity),'1');assert.ok(!(await card.getAttribute('class')).includes('expanded'));
            }
            await page.getByRole('button',{name:'读取最新存档',exact:true}).click();await page.reload({waitUntil:'networkidle'});await page.locator('.article-card').first().waitFor();
            await page.getByRole('button',{name:'查看全部已采集文章'}).click();await page.locator('.archive-entry').first().waitFor();assert.ok(page.url().endsWith('#articles'));
            const total=manifest.index.length,pages=Math.ceil(total/20),urls=[];
            for(let p=1;p<=pages;p++){
              await page.waitForFunction(expected=>document.querySelector('.archive-pagination')?.textContent.includes('第 '+expected+' /'),p);
              await page.waitForFunction(count=>document.querySelectorAll('.archive-entry').length===count,p<pages?20:total-(p-1)*20);
              urls.push(...await page.locator('.archive-entry h2 a').evaluateAll(nodes=>nodes.map(node=>node.href)));if(p<pages)await page.getByRole('button',{name:'下一页',exact:true}).click();
            }
            assert.equal(urls.length,total);assert.equal(new Set(urls).size,total);
            for(const country of ['台湾','美国','英国','日本']){
              await page.getByLabel('来源地区').selectOption(country);await page.waitForFunction(name=>document.querySelector('.archive-entry-meta')?.textContent.includes(name),country);
              assert.ok((await page.locator('.archive-pagination').textContent()).includes(manifest.counts[country]+' 篇'));
            }
            await page.getByLabel('来源地区').selectOption('');await page.getByLabel('搜索文章').fill('中共');await page.getByRole('button',{name:'搜索',exact:true}).click();await page.waitForTimeout(300);
            await page.reload({waitUntil:'networkidle'});await page.locator('.archive-entry').first().waitFor();assert.ok(page.url().endsWith('#articles'));assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth));assert.equal(errors.length,0);
            assert.ok(requests.every(r=>r.method==='GET'&&r.url.startsWith(root)));assert.ok(!requests.some(r=>r.url.includes('onrender.com')||r.url.includes('/api/')));
            evidence.push({width,articleCount:total,countries:manifest.counts,cardsVerified:5,requestCount:requests.length,backendRequests:0,errors,hashReload:true});await context.close();
          }}finally{await browser.close();}
          const result={checkedAt:new Date().toISOString(),url:root,revision:manifest.revision,dataUpdatedAt:manifest.dataUpdatedAt,relationshipCount:manifest.analysis?.relationships?.length,evidence};
          const summary='```json\n'+JSON.stringify(result,null,2)+'\n```';appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary+'\n');console.log(JSON.stringify(result));
          const check=await fetch('https://api.github.com/repos/darkcai726-wq/taiwan-intelligence-public/check-runs',{method:'POST',headers:{Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({name:'Public static desktop and mobile',head_sha:process.env.GITHUB_SHA,status:'completed',conclusion:'success',output:{title:'Real Pages desktop/mobile verification passed',summary}})});assert.equal(check.status,201);
          JS
      - name: Verify own-token Pages build API without changing the snapshot
        if: ${{ inputs.deployment_only }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://api.github.com/repos/darkcai726-wq/taiwan-intelligence-public';
          async function api(path,data){const r=await fetch(base+path,{method:data?'POST':'GET',headers:{Authorization:`Bearer ${process.env.GITHUB_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});assert.ok(r.ok,'Pages verification HTTP '+r.status);return {status:r.status,body:await r.json()};}
          const head=(await api('/git/ref/heads/gh-pages')).body.object.sha;
          const requested=await api('/pages/builds',{});assert.equal(requested.status,201);
          const buildPath=requested.body.url?.startsWith(base+'/pages/builds/')?requested.body.url.slice(base.length):'';assert.match(buildPath,/^\/pages\/builds\/\d+$/);
          let built=false;
          for(let i=0;i<30;i++){const build=(await api(buildPath)).body;if(build.commit===head&&build.status==='built'){built=true;break;}assert.ok(build.commit!==head||build.status!=='errored');await new Promise(resolve=>setTimeout(resolve,10000));}
          assert.ok(built,'Pages build did not finish');assert.equal((await api('/git/ref/heads/gh-pages')).body.object.sha,head);
          const result={checkedAt:new Date().toISOString(),requestStatus:requested.status,buildStatus:'built',commit:head,archiveChanged:false,collectionCalls:0,modelCalls:0};
          const check=await api('/check-runs',{name:'Own-token Pages build API',head_sha:process.env.GITHUB_SHA,status:'completed',conclusion:'success',output:{title:'Own GITHUB_TOKEN requested and completed a Pages build',summary:JSON.stringify(result,null,2)}});assert.equal(check.status,201);console.log(JSON.stringify(result));
          JS
